name: Pipeline

# Ephemeral-runner replacement for the old Windows Task Scheduler jobs — see
# cmd_cloud_tick in src/cli.py and the "Migrating off Windows Task Scheduler"
# section of HANDOFF.md. Each run decides for itself whether to post: inside
# the posting window, under the daily quota, and far enough past the last
# actual post. If not, it exits almost immediately (near-zero minutes used).
# If so, it generates, assembles and publishes exactly one video in this same
# run, then commits the updated queue state back to the repo — nothing needs
# to survive on-disk between separate runs except that one file.
on:
  schedule:
    # Fixed times rather than a */20 poll. Measured over 95 scheduled runs,
    # GitHub delivered ~6 of the 72 daily triggers a 20-minute cron asked for,
    # and the gap between consecutive runs was NEVER under 121 minutes — no
    # short gaps at all, then a spread from 2-7h. Random load-shedding would
    # have left plenty of short gaps, so that floor is GitHub enforcing a
    # minimum interval on a high-frequency schedule. Polling harder bought
    # nothing and plausibly caused the throttling.
    #
    # These sit ~2h10m apart (above that floor) and land inside the 9am-11pm
    # Eastern posting window in BOTH EDT and EST, since cron is always UTC.
    # Five opportunities for three posts, so a dropped or late trigger costs
    # redundancy rather than the day's post. cloud-tick itself decides whether
    # to post (window / daily quota / min_gap) and jitters the publish time, so
    # fixed triggers do not mean identical post times every day.
    #
    # All five sit in the FIRST half of the window on purpose. GitHub does not
    # just skip triggers, it fires them hours late: on 2026-09-29 the 21:40 and
    # 02:40 UTC entries actually ran at 05:38 and 08:58 UTC, three to six hours
    # behind, by which point they were 01:42 and 05:02 Eastern - outside the
    # 9am-11pm posting window, so cloud-tick correctly did nothing and two of
    # the day's four runs were wasted. Entries late in the window cannot
    # survive that; entries early in it can. The latest here is 18:50 Eastern,
    # so even a four-hour delay still lands inside the window.
    - cron: "10 14 * * *"   # 10:10 EDT / 09:10 EST
    - cron: "20 16 * * *"   # 12:20 EDT / 11:20 EST
    - cron: "30 18 * * *"   # 14:30 EDT / 13:30 EST
    - cron: "40 20 * * *"   # 16:40 EDT / 15:40 EST
    - cron: "50 22 * * *"   # 18:50 EDT / 17:50 EST
  workflow_dispatch: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    # cloud-tick now catches up on every overdue slot in one run (not just
    # the first), since GitHub's actual scheduled cadence can run hours
    # behind the configured cron — bumped from 90 to comfortably fit
    # posts_per_day (default 3) full generate cycles back to back if a run
    # ever needs to catch up on a whole day's worth at once.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Decide whether this run has work to do
        id: gate
        # Most scheduled runs have nothing to do - outside the posting window,
        # the daily quota already met, or too soon after the last post. Finding
        # that out used to cost ~4 minutes: restoring ~4.6GB of caches and
        # installing torch, chatterbox and Chromium, only to print "outside the
        # posting window" and exit. On 2026-09-29 two of four runs were exactly
        # that. This asks the question first, for pennies.
        #
        # scripts/should_run.py imports cmd_cloud_tick's own helpers rather
        # than reimplementing the checks, so the two cannot drift; every heavy
        # import in src.cli is function-local, which is what makes that cheap.
        # It fails OPEN, because a wrongly-skipped run costs a post while a
        # wrongly-started one costs four minutes. Note the gated steps test
        # `!= 'false'`, not `== 'true'`: if this STEP itself dies (a bad pip
        # install, say) the output is unset, and testing for 'true' would then
        # skip every expensive step and silently stop the pipeline posting
        # altogether. Unset has to mean proceed.
        run: |
          python -m pip install --quiet pyyaml pydantic python-dotenv
          python scripts/should_run.py

      - name: Cache pip packages
        if: steps.gate.outputs.proceed != 'false'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Chatterbox model weights
        if: steps.gate.outputs.proceed != 'false'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: chatterbox-model-v1

      - name: Cache downloaded pipeline assets
        id: cache-assets
        if: steps.gate.outputs.proceed != 'false'
        uses: actions/cache@v6
        with:
          path: |
            assets/backgrounds/normalized
            assets/voices
            assets/music
          key: pipeline-assets-v1

      # Large binaries (background clips, TTS voice references, ambient
      # music) live as attachments on the "assets-v1" GitHub Release instead
      # of Git LFS — they total ~1.65GB, over LFS's 1GB free storage tier.
      # Only runs on a cache miss (first run, or if the cache is ever evicted).
      - name: Download pipeline assets from release
        if: steps.gate.outputs.proceed != 'false' && steps.cache-assets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/backgrounds/normalized assets/voices assets/music /tmp/release-assets
          gh release download assets-v1 --repo "${{ github.repository }}" --dir /tmp/release-assets
          mv /tmp/release-assets/*.mp4 assets/backgrounds/normalized/
          mv /tmp/release-assets/chatterbox_ref_*.wav assets/voices/
          mv /tmp/release-assets/en_US-*.onnx assets/voices/
          mv /tmp/release-assets/en_US-*.onnx.json assets/voices/
          mv /tmp/release-assets/soft_ambient.wav assets/music/

      - name: Install system dependencies
        if: steps.gate.outputs.proceed != 'false'
        run: |
          sudo apt-get update
          # fonts-lato: the caption format pins Lato rather than inheriting the
          # -apple-system stack the card templates use, none of which exists on
          # Linux. Without this the runner silently falls back to a different
          # face and renders captions unlike anything tested locally.
          sudo apt-get install -y ffmpeg fonts-lato

      - name: Install Python dependencies
        if: steps.gate.outputs.proceed != 'false'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright's Chromium
        if: steps.gate.outputs.proceed != 'false'
        run: .venv/bin/playwright install --with-deps chromium

      - name: Run pipeline tick
        if: steps.gate.outputs.proceed != 'false'
        env:
          MOBILE_SYNC_DIR: ""
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: .venv/bin/python -m src.cli cloud-tick

      - name: Scrub secrets and commit updated state back to the repo
        # if: always() is load-bearing. These two steps used to default to
        # if: success(), so a tick that raised threw away every state change it
        # had already made. That is not just the day's randomized slots and
        # premise dedup rows — a crash *after* a successful publish discarded
        # the instagram_id too, leaving the slot unfired so a later run would
        # post a second video for it. Observed 2026-09-26, when a Gemini 429
        # killed the run and both steps below were skipped.
        #
        # Scrubbing and committing are deliberately ONE step: data/state.db's
        # `tokens` table caches refreshed access/refresh tokens and this repo
        # is public, so a commit must never be reachable without the scrub
        # having just run. scripts/scrub_tokens.py exits non-zero if any token
        # row survives, and set -e stops the commit dead if it does. It is a
        # file rather than an inline python -c because inline it depended on
        # `python` being on PATH, and where it is not (python3 only) the scrub
        # failed silently while the commit carried on.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f data/state.db ]; then
            echo "No data/state.db — nothing to commit."
            exit 0
          fi

          # if/else rather than `[ -x ... ] && PY=...`: under set -e a failing
          # test as the last command of a line aborts the whole step.
          if [ -x .venv/bin/python ]; then
            PY=.venv/bin/python
          else
            PY=python3
          fi
          "$PY" scripts/scrub_tokens.py

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The push races anything else that lands on master while a run is in
          # flight - a run takes 20-50 minutes, and a couple of ordinary code
          # pushes during one is enough to get it rejected as non-fast-forward.
          # That is not cosmetic: the step fails, the state is never committed,
          # and the publish it was recording is forgotten, so a later run can
          # post a second video for the same slot. Observed 2026-09-28, where a
          # run published fine and then went red here, losing the record.
          #
          # data/state.db is the only file this job changes, and only one run
          # executes at a time (concurrency group), so this run's copy is
          # authoritative: take the newest master, lay our state.db on top,
          # commit, push, and retry from fresh if someone beat us to it.
          cp data/state.db "$RUNNER_TEMP/state.db"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin master
            git checkout -B master origin/master
            cp "$RUNNER_TEMP/state.db" data/state.db
            git add data/state.db
            if git diff --cached --quiet; then
              echo "No state changes to commit."
              exit 0
            fi
            git commit -m "Update pipeline state [skip ci]"
            if git push origin HEAD:master; then
              echo "State committed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — refetching and retrying."
            sleep $((attempt * 5))
          done
          echo "Could not push state after 3 attempts." >&2
          exit 1
