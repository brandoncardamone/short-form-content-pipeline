video:
  width: 1080
  height: 1920
  fps: 30
  # Cut from 60-90s on 2026-09-28. Completion rate is the signal that drives
  # distribution, and an account with no watch history behind it has to earn
  # that on every video - a 40s video that finishes beats an 80s one that does
  # not. Text-chain message count derives from these (see textchain.py's
  # _target_messages), and the Reddit acceptance band is min*0.9..max*0.8, so
  # raising or lowering these changes both generators automatically.
  target_duration_min: 30   # seconds
  target_duration_max: 55

tts:
  engine: chatterbox         # kokoro | piper | elevenlabs | chatterbox (kokoro fails on Python 3.14 due to blis/spacy)
  speed: 1.35                # atempo multiplier applied via ffmpeg (was 1.5 — reddit narration read slightly too fast)
  gap_ms: 90                 # silence inserted after each beat
  voices:
    a: voice_a               # protagonist (right, blue) — cloned from assets/voices/chatterbox_ref_female.wav
    b: voice_b                # other party (left, gray) — cloned from assets/voices/chatterbox_ref_male.wav

llm:
  provider: gemini
  model: gemini-3.6-flash   # gemini-2.5-flash no longer available to this account.
                             # IMPORTANT: this model is itself capped at 20 requests/DAY on the
                             # free tier (confirmed live 2026-09-28 by exhausting it:
                             # quota_id GenerateRequestsPerDayPerProjectPerModel-FreeTier,
                             # quota_value 20). It was pinned here to escape exactly that cap on
                             # gemini-flash-latest, so that reasoning no longer holds. At 3 posts
                             # a day with one call each it fits, but retries and any manual
                             # testing eat into the same 20. llm.py fails fast on the per-day cap
                             # rather than waiting, since waiting cannot clear it.

content:
  # random picks one format per video using the weights below. Five formats,
  # three visual treatments - see HANDOFF.md.
  #   reddit_story : real sourced Reddit post, dark Reddit-style cards
  #   textchain    : fake 1:1 iMessage drama, chat bubbles
  #   groupchat    : same bubbles, 3-4 participants with sender names
  #   wiki_facts   : real event from Wikipedia On This Day, full-screen captions
  #   monologue    : original confession/diary/voicemail, full-screen captions
  format: random
  weights:
    reddit_story: 3
    textchain: 3
    groupchat: 2
    wiki_facts: 2
    monologue: 2
  # ^ set any of these to 0 to retire a format without deleting its generator.
  #   Note every format except reddit_story costs one Gemini call per video,
  #   and the free tier allows only 20 per DAY - see the note on llm.model.

tiktok:
  post_mode: inbox            # inbox (works today, no review — human pastes caption/hashtags
                              # manually, confirmed structural limitation, not fixable) | direct
                              # (needs TikTok app review — see project memory for submission status)

schedule:
  posts_per_day: 3            # tunable — start conservative, raise once quality/reach is verified
  window_start_hour: 9        # local time, 24h clock
  window_end_hour: 23
  platform: instagram          # both | instagram | tiktok — set to instagram-only 2026-09-03
                                # while TikTok's production review is pending; flip back to
                                # both once approved
  min_gap_minutes: 30          # no two randomized slots land closer together than this

reddit:
  access: arctic               # arctic (no auth, archive) | json (blocked as of 2026) | praw (needs approved app)
  subreddits: [AskReddit, menofreddit, tifu, AmItheAsshole, relationship_advice, confession,
               TrueOffMyChest, pettyrevenge, MaliciousCompliance, offmychest, ChoosingBeggars]
  # ^ order no longer matters: _candidate_posts_arctic shuffles this list per call. It used to be
  # significant, and that was the problem - a whole subreddit is yielded before the next one is
  # tried, so a fixed order meant whichever subreddit reliably produced usable posts won every
  # time (23 of 33 published Reddit videos were r/tifu despite two subreddits being listed ahead
  # of it). AskReddit/menofreddit are question+top-comments format; the rest are narrative.
  mode: auto                 # auto | narrative | qa — auto picks by whether the post has real body text
  listing: top                # top | hot — json/praw only
  time_filter: month          # for listing: top — day | week | month | year | all — json/praw only
  min_score: 800               # was 2000. Combined with the narrower duration band above, a 2000
                               # floor left too small a pool to draw a varied mix from - most
                               # subreddits never yielded an acceptable post at all, which is how
                               # r/tifu came to dominate. 800 is still comfortably "this got real
                               # attention" without starving the selection.
  max_comments: 15             # generous cap — the real length gate is the word-count/duration
                                 # estimate below, not this; more headroom lets a viral post with
                                 # plenty of good comments actually reach the target duration
  min_comments: 2              # reject a qa-mode post if fewer than this many comments qualify
                               # (was 3; qa-mode posts were being rejected so often that the
                               # question+comments format nearly vanished from the output)
                                 # (Arctic Shift's comment archive is often sparse even for viral posts)
  min_comment_score: 10        # was 15 - same reason as min_comments
  allow_nsfw: false
  fetch_pool_size: 25
  archive_min_age_days: 180    # arctic only: skip posts newer than this (scores not settled yet)
  archive_max_age_days: 730    # arctic only: skip posts older than this
  archive_samples: 10          # arctic only: random time-slices sampled per subreddit (better odds of a viral hit)
  archive_sample_span_days: 3  # arctic only: width of each sampled time-slice, in days

card:
  # Fallback only. The contact name now comes from the generated script so it
  # matches the story - see textchain.py. Until 2026-09-28 this single value
  # headed every text chain, so every video was a conversation with "Maddy".
  contact_name: "Maddy ❤️"
  avatar: null               # path to image, or null for gray circle

output:
  work_dir: output/work
  ready_dir: output/ready
  db_path: data/state.db
  # OneDrive-synced folder — each assembled video's mp4 + caption.txt land here
  # automatically, so the caption is one tap away on the phone that does the
  # actual TikTok posting (TikTok's Sandbox mode doesn't reliably pre-fill it).
  mobile_sync_dir: /mnt/c/Users/bcard/OneDrive/Desktop/Projects/sfcp/pipeline_output/ready_to_post
  mobile_sync_cap_gb: 1.0      # oldest video+caption pairs deleted (mtime order) past this cap

music:
  enabled: true
  volume_db: -28             # relative to voice loudnorm target

backgrounds:
  normalized_dir: assets/backgrounds/normalized
  clips: []
  # clips:
  #   - name: parkour
  #     path: assets/backgrounds/parkour.mp4
  #     crop_x: null         # null = center crop; integer = left edge of 1080px crop window
