# The Terraria YouTube-only stream: extra Shorts for the same channel as the
# terraria profile, which posts one video a day to Instagram AND YouTube.
# These go to YouTube only, are shorter, and are written for how Shorts are
# ranked: viewers decide in the first second, and how much of the video they
# watch is the main signal (see terraria.learn_from_analytics below).
#
# Run it with:  python -m src.cli cloud-tick --profile terraria_yt
#
# Credentials: none of its own. youtube.channel_profile borrows the terraria
# channel's login; it has no Instagram credentials on purpose, so nothing here
# can ever post to Instagram.

video:
  width: 1080
  height: 1920
  fps: 30
  # Long enough to actually explain an item. Build time scales with this:
  # Chatterbox on a CPU runner is most of a build, so going past ~2 minutes
  # risks the workflow timeout before it risks anything else.
  # Shorts hold viewers far better at 30-45s than at the 60-80s the Instagram
  # videos run. Retention numbers decide whether this moves.
  target_duration_min: 30
  target_duration_max: 45

tts:
  engine: chatterbox
  speed: 1.3
  speed_jitter: 0.08
  # How animated the read is. Chosen by experiment (2026-10-06, 10 takes per
  # setting, each checked by src/tts/qa.py):
  #   exaggeration 0.60 / cfg 0.45   0 of 10 failed   (the original setting)
  #   exaggeration 0.75 / cfg 0.40   0 of 10 failed
  #   exaggeration 0.90 / cfg 0.35   0 of 10 failed
  #   exaggeration 1.05 / cfg 0.30   1 of 10 failed, and the same sentence ran
  #                                  anywhere from 2.7s to 4.8s
  # So this sits just under the level where takes start going wrong, and the
  # jitter is kept narrow enough that no video can land on that level. Ten
  # takes is a small sample: if "Voice QA" retakes in the build logs become
  # common, bring exaggeration down before touching anything else.
  exaggeration: 0.85
  exaggeration_jitter: 0.07
  cfg_weight: 0.37
  cfg_weight_jitter: 0.04
  gap_ms: 110
  # Every generated line is checked (src/tts/qa.py) and re-recorded if it comes
  # out garbled. Required for the more animated delivery above: the livelier
  # the read, the more often Chatterbox produces a bad take.
  qa_enabled: true
  qa_max_attempts: 3
  voices:
    a: voice_b                # the narrator (the male reference clip); one voice only
    b: voice_b

llm:
  # Same list and order as config.yaml - see the note there on why it is long.
  model: gemini-3.6-flash
  fallback_models:
    - gemini-3.8-flash
    - gemini-3.7-flash
    - gemini-3.5-flash
    - gemini-3-flash-preview
    - gemini-3.1-flash-lite
    - gemini-3.5-flash-lite

content:
  format: random
  weights:
    terraria: 1               # this account is the Terraria format, nothing else
    explainer: 0
    reddit_story: 0
    textchain: 0
    groupchat: 0
    wiki_facts: 0
    monologue: 0

schedule:
  posts_per_day: 2
  timezone: America/New_York
  # Starts later than the terraria profile's window so the day's shared
  # Instagram+YouTube video goes out first and these follow it, spaced out,
  # instead of landing on the channel minutes apart from it.
  window_start_hour: 13
  window_end_hour: 23
  min_gap_minutes: 120
  gap_includes_related: true   # never right after the shared terraria post
  jitter_max_minutes: 45
  platform: youtube

youtube:
  privacy: public          # private to test without anyone seeing it
  category_id: "20"        # Gaming
  synthetic_media: true    # "altered or synthetic content" label: cloned narration voice
  channel_profile: terraria
  playlists: true

terraria:
  related_dbs: [data/state_terraria.db]
  trending_share: 0.15
  learn_from_analytics: true
  prompt_notes: |
    THIS IS A YOUTUBE SHORT. Viewers swipe away within the first second unless the opening grabs
    them, and how much of the video they watch decides whether it is shown to anyone else.
    - Beat 1 is at most 9 words and is the hook itself. No warm-up, no context first.
    - Cut every beat that is only context. Keep only the beats that pay off the hook.
    - The last beat asks the viewer something specific they can answer in a word or two
      (a choice, a guess, their own experience), not "let me know in the comments".
    - Write it so the last beat leads naturally back into the first, so the video loops.

compilation:
  enabled: true
  weekday: 6               # Sunday
  min_videos: 6

tiktok:
  post_mode: inbox

card:
  contact_name: "unused"      # no chat-card formats on this account
  avatar: null

output:
  work_dir: output/work_terraria_yt
  ready_dir: output/ready_terraria_yt
  # Its own database, so the accounts cannot claim each other's videos or
  # count each other's posts toward the daily quota.
  db_path: data/state_terraria_yt.db
  mobile_sync_dir: null
  mobile_sync_cap_gb: 1.0

music:
  enabled: true
  volume_db: -30

backgrounds:
  # Terraria gameplay only - kept apart from the other account's clips.
  normalized_dir: assets/backgrounds/terraria
  clips: []
  allow_flip: false           # the game's HUD text would read backwards
  prefer_bright: true         # 70% of the clip is night fights on a black sky
