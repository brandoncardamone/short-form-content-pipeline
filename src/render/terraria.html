<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>{{ css }}</style>
</head>
<body class="{{ mode }}" style="--highlight: {{ highlight }}">
  <div id="title">{{ title }}</div>
  <div id="panel"{% if not has_media %} class="empty"{% endif %}>
    <div id="media"></div>
    {% if label %}<div id="label">{{ label }}</div>{% endif %}
  </div>
  <div id="progress"></div>
  <div id="stage">
    <div id="caption" style="font-size: {{ font_size }}px">{{ html_text }}</div>
  </div>
</body>
</html>
